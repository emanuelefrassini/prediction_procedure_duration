name: Research code checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          # Only metadata, source and lightweight tests; avoid checking out
          # clinical phase CSV arrays on the public CI runners.
          sparse-checkout: |
            /.github/
            /.gitignore
            /README.md
            /CITATION.cff
            /requirements-validation.txt
            /requirements.txt
            /docs/
            /tests/
            /scripts/
            /models/PAPER_ETC.py
            /models/README.md
            /utils/paper_training.py
            /utils/models.py
            /tools/README.md
            /data/README.md
            /figures/README.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Experiment preflight (metadata only)
        run: python scripts/check_experiment.py --skip-data
