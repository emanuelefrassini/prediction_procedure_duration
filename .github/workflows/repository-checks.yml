name: Research repository checks (no clinical data)
on:
  push:
  pull_request:
jobs:
  data-free-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          # Do not place tracked clinical phase CSVs into CI's working tree.
          sparse-checkout: |
            /.github/
            /README.md
            /.gitignore
            /CITATION.cff
            /requirements-validation.txt
            /docs/
            /figures/
            /phase_etc/
            /scripts/
            /tests/
            /models/PAPER_ETC.py
            /models/inceptiontime_ETC.py
          sparse-checkout-cone-mode: false
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight verification dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Repository and metric unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Synthetic ETC smoke test
        run: python scripts/smoke_etc.py
