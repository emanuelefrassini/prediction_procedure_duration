name: Causal ETC synthetic benchmark
on:
  push:
    paths: ['modern_etc/**', '.github/workflows/modern-etc.yml']
  pull_request:
    paths: ['modern_etc/**', '.github/workflows/modern-etc.yml']
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: modern_etc
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r modern_etc/requirements.txt
      - run: python -m pytest modern_etc/tests -q
      - run: python -m modern_etc --cases 18 --epochs 1 --width 8 --output /tmp/etc.json
